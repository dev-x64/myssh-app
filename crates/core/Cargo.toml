[package]
name = "myssh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent core of MySSH: vault, SSH sessions, known hosts"

[dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
# Signing for the forwarded agent, as the SSH keys library does it.
signature = { version = "3", default-features = false }
tar = { version = "0.4", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chacha20poly1305 = "0.10"
zeroize = "1"
log = "0.4"
trash = "5"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Reading FileZilla's site list, for the import.
quick-xml = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }

[dev-dependencies]
tempfile = "3"
