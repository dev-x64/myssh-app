<!doctype html>
<!-- The picture behind the icons in the installer's window (660 × 440 points).
     The app's icon sits at (180, 170) and the Applications folder at (480, 170);
     see scripts/dmg-settings.py. Turn it into background.tiff with
     scripts/dmg-background.sh after changing it.

     It is light on purpose: the Finder writes the names under the icons in
     black whatever the picture, and on a dark one they cannot be read. The
     lower part holds nothing that matters, because the Finder's own status
     and path bars, when someone has them on, cover it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 660px;
        height: 440px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(ellipse 420px 240px at 50% 40%, rgba(255, 122, 69, 0.13), transparent 72%),
          linear-gradient(170deg, #fcfcfd 0%, #f3f4f7 55%, #e9ebef 100%);
      }
      /* A faint grid of dots, like an empty terminal. */
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(20, 28, 40, 0.09) 1px, transparent 1.2px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(ellipse 62% 70% at 50% 42%, #000 25%, transparent 85%);
      }
      svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 282px;
        text-align: center;
        color: #2a2f38;
        font-size: 14px;
        font-weight: 550;
        letter-spacing: 0.005em;
      }
      .caption small {
        display: block;
        margin-top: 4px;
        color: #7b8391;
        font-size: 11.5px;
        font-weight: 400;
      }
      .prompt {
        position: absolute;
        left: 22px;
        top: 18px;
        color: rgba(226, 83, 10, 0.75);
        font: 600 12px "SF Mono", Menlo, monospace;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="prompt">&gt;_ MySSH</div>
    <svg width="660" height="440" viewBox="0 0 660 440" fill="none">
      <!-- The way from the app to the folder. -->
      <path d="M268 170 H388" stroke="rgba(226,83,10,0.75)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9" />
      <path d="M380 158 L393 170 L380 182" stroke="rgba(226,83,10,0.95)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="caption">
      Перетащите MySSH в папку «Программы»
      <small>Drag MySSH to the Applications folder</small>
    </div>
  </body>
</html>
