[package]
name = "myssh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MySSH — SSH client"

[lib]
name = "myssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
myssh-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs"] }
log = "0.4"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
# The terminal on this computer: a pseudo-terminal on macOS, ConPTY on Windows.
portable-pty = "0.9"
tauri-plugin-deep-link = "2"

# Web addresses open in the phone's browser through the system.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"

# Where PuTTY, WinSCP and MobaXterm keep their sessions, for the import.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
